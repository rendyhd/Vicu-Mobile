name: Android developer verification APK

# Builds a release APK signed with the release key that carries the Play Console's
# Android developer verification snippet in assets/adi-registration.properties, to prove
# ownership of a package name and key (Play Console, Android developer verification,
# Sign and upload an APK). The APK is only for that upload; it is never distributed.

on:
  workflow_dispatch:
    inputs:
      snippet:
        description: 'Snippet from the Play Console'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The local speech library (native/speech, whisper.cpp) is built with the NDK and CMake that
      # app/build.gradle.kts pins; the runner's SDK may hold other versions (licences are accepted).
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Create keystore.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Add the verification snippet
        env:
          SNIPPET: ${{ inputs.snippet }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s\n' "$SNIPPET" > app/src/main/assets/adi-registration.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: adi-registration-apk
          path: app/build/outputs/apk/release/*.apk
