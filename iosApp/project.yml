# The Xcode project is generated from this file: run scripts/generate.sh (XcodeGen), then open
# Vicu.xcodeproj. The generated project is not checked in.
name: Vicu
options:
  bundleIdPrefix: com.rendyhd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  # Debug's identity with optimized code (Configuration/Profile.xcconfig).
  Profile: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
  Profile: Configuration/Profile.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Vicu:
    type: application
    platform: iOS
    sources:
      - path: Vicu
      - path: Shared
      # The bundled Silero voice detector for local speech (IosSpeechStorage reads it from here).
      - path: ../native/speech/models/ggml-silero-v6.2.0.bin
        buildPhase: resources
    dependencies:
      - target: VicuWidgets
      - target: VicuShare
    info:
      path: Vicu/Info.plist
      properties:
        CFBundleDisplayName: $(VICU_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform draws at the display's full refresh rate only with this key.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted Vikunja servers often run on plain http on a home network. Only
        # NSAllowsArbitraryLoads is set: with NSAllowsLocalNetworking or
        # NSAllowsArbitraryLoadsInWebContent present as well, iOS ignores it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Vicu connects to your Vikunja server, which may be on your local network.
        # Location reminders. No location background mode: CLMonitor relaunches the app for an event.
        NSLocationWhenInUseUsageDescription: Vicu uses your location to remind you when you arrive at or leave a place you chose. It stays on this device.
        NSLocationAlwaysAndWhenInUseUsageDescription: Vicu uses your location to remind you when you arrive at or leave a place you chose, also when the app is closed. It stays on this device.
        # Holding + to say a task: asked on the first hold, never at start (docs/voice-input.md).
        NSMicrophoneUsageDescription: Vicu listens while you hold the + button, to add what you say as a task.
        NSSpeechRecognitionUsageDescription: Vicu turns what you say while holding the + button into a task. Apple processes the speech, on the device where it can.
        CFBundleURLTypes:
          - CFBundleURLName: com.rendyhd.vicu
            CFBundleURLSchemes:
              - $(VICU_URL_SCHEME)
        # Read by the shared Kotlin code and the extensions.
        VicuUrlScheme: $(VICU_URL_SCHEME)
        VicuAppGroup: $(VICU_APP_GROUP)
        # The home-screen quick action (SceneDelegate in AppDelegate.swift).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.rendyhd.vicu.add
            UIApplicationShortcutItemTitle: Add task
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
        BGTaskSchedulerPermittedIdentifiers:
          - com.rendyhd.vicu.refresh
          - com.rendyhd.vicu.sync
        UIBackgroundModes:
          - fetch
          - processing
    entitlements:
      path: Vicu/Vicu.entitlements
      properties:
        com.apple.security.application-groups:
          - $(VICU_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VICU_BUNDLE_ID)
        PRODUCT_NAME: Vicu
        # Shared/ is built into the app and the extensions; this tells them apart.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) VICU_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The shared framework is static, so the app links what its speech library needs
        # (shared/src/nativeInterop/cinterop/vicuSpeech.def).
        OTHER_LDFLAGS: $(inherited) -framework shared -framework Metal -framework MetalKit -framework Accelerate -lc++
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-shared-framework.sh"

  # The widgets and the Control Center control. Swift only: no Kotlin is linked. The app writes
  # what they show into the App Group (shared/.../widget/WidgetSnapshots.kt).
  VicuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VicuWidgets
      - path: Shared
    info:
      path: VicuWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(VICU_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        VicuUrlScheme: $(VICU_URL_SCHEME)
        VicuAppGroup: $(VICU_APP_GROUP)
    entitlements:
      path: VicuWidgets/VicuWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(VICU_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VICU_BUNDLE_ID).widgets
        PRODUCT_NAME: VicuWidgets
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks

  # The share sheet: saves what is shared into the App Group (share-inbox/), and the app turns it
  # into a task (shared/.../share/IosShareInbox.kt). Swift only.
  VicuShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VicuShare
    info:
      path: VicuShare/Info.plist
      properties:
        CFBundleDisplayName: $(VICU_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # What Vicu is offered for: text, a web page, images, videos and files.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
        VicuAppGroup: $(VICU_APP_GROUP)
    entitlements:
      path: VicuShare/VicuShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(VICU_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VICU_BUNDLE_ID).share
        PRODUCT_NAME: VicuShare
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
